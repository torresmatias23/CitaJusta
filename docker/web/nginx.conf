worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  client_max_body_size 1m;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  # Never log query strings, headers or bodies containing session/identity data.
  access_log off;

  upstream citajusta_api {
    server api:3000;
  }

  # Empty values do not add a header to public/static resources. Also covers
  # API errors produced by Nginx before a response arrives from NestJS.
  map $uri $citajusta_cache_control {
    default "";
    ~*^/api/v1(?:/|$) "no-store";
    /index.html "no-cache";
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Set one copy at the edge, including on errors and the SPA fallback.
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cache-Control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $citajusta_cache_control always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location = /health {
      proxy_pass http://citajusta_api;
    }
    location = /api/v1 {
      proxy_pass http://citajusta_api;
    }
    location ^~ /api/v1/ {
      proxy_pass http://citajusta_api;
    }
    location /assets/ {
      try_files $uri =404;
    }
    location = /index.html {
      # Cache policy is set at server level to preserve header inheritance.
    }
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
