name: Daily Scrum Historical Backfill

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sin crear Issues"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  historical-backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Crear registros históricos
        uses: actions/github-script@v7
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const fs = require("fs");

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const dryRun = process.env.DRY_RUN === "true";

            const history = JSON.parse(
              fs.readFileSync(
                "docs/scrum/daily-scrum-history.json",
                "utf8"
              )
            );

            try {
              await github.rest.issues.getLabel({
                owner,
                repo,
                name: "daily-scrum",
              });
            } catch (error) {
              if (error.status === 404) {
                if (!dryRun) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: "daily-scrum",
                    description:
                      "Registro diario del trabajo Scrum del equipo CitaJusta",
                    color: "0E8A16",
                  });
                } else {
                  core.info(
                    "[DRY RUN] Se crearía la etiqueta daily-scrum."
                  );
                }
              } else {
                throw error;
              }
            }

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner,
                repo,
                state: "all",
                per_page: 100,
              }
            );

            const existingTitles = new Set(
              issues
                .filter(issue => !issue.pull_request)
                .map(issue => issue.title)
            );

            for (const entry of history) {
              const title = `Daily Scrum · ${entry.date}`;

              if (existingTitles.has(title)) {
                core.info(
                  `Ya existe ${title}. Se omite para evitar duplicados.`
                );
                continue;
              }

              const work = entry.work
                .map(item => `- ${item}`)
                .join("\n");

              const evidence = entry.evidence
                .map(item => `- ${item}`)
                .join("\n");

              const body = `> **Registro histórico reconstruido a partir de evidencia verificable del repositorio.**
              >
              > Este Issue fue creado retrospectivamente y no implica que se haya realizado una Daily Scrum formal en esta fecha, salvo que se indique expresamente.

              # Daily Scrum · ${entry.date}

              ## Estado del Sprint

              **Sprint:** ${entry.sprint}
              **Estado:** ${entry.status}
              **Objetivo:** ${entry.goal}

              ---

              ## Trabajo realizado

              ${work}

              ## Resultado

              ${entry.result}

              ## Bloqueos documentados

              ${entry.blockers}

              ## Evidencia

              ${evidence}

              ## Próximo paso conocido

              ${entry.nextStep}

              ---

              _Registro histórico generado durante la formalización del proceso Daily Scrum de CitaJusta._
              `;

              if (dryRun) {
                core.info(`[DRY RUN] Se crearía: ${title}`);
                continue;
              }

              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ["daily-scrum"],
              });

              existingTitles.add(title);

              core.info(`Creado: ${title}`);
            }

            if (dryRun) {
              core.info(
                "DRY RUN completado. No se crearon Issues."
              );
            } else {
              core.info(
                "Backfill histórico completado."
              );
            }
